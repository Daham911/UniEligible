AWSTemplateFormatVersion: '2010-09-09'
Description: >
  AWS CloudFormation Template for UniEligible Application
  Architecture: Custom VPC, Public Subnet (EC2), Private Subnets (Amazon RDS PostgreSQL 16),
  Internet Gateway, Route Tables, and Least-Privilege Security Groups.

Parameters:
  EnvironmentName:
    Type: String
    Default: unieligible-prod
    Description: Environment prefix name

  AdminIP:
    Type: String
    Default: 0.0.0.0/0
    Description: CIDR block for administrative SSH access (restricted to administrator IP)

  DBUsername:
    Type: String
    Default: postgres
    Description: Master username for RDS PostgreSQL

  DBPassword:
    Type: String
    NoEcho: true
    Description: Master password for RDS PostgreSQL

  EC2KeyPairName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Name of an existing EC2 KeyPair for SSH access
    Default: unieligible-ec2-key

Resources:
  # ========================================================
  # VPC & NETWORKING (10.0.0.0/16)
  # ========================================================
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-vpc'

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-igw'

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  # Public Application Subnet (10.0.1.0/24)
  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-public-subnet-1'

  # Private Database Subnet 1 (10.0.2.0/24) - AZ 1
  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-private-db-subnet-1'

  # Private Database Subnet 2 (10.0.3.0/24) - AZ 2
  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.3.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-private-db-subnet-2'

  # Route Table for Public Subnet
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-public-rt'

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  # ========================================================
  # SECURITY GROUPS
  # ========================================================
  # EC2 Application Security Group
  EC2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for UniEligible EC2 application server
      VpcId: !Ref VPC
      SecurityGroupIngress:
        # HTTP Application Traffic (Port 8080)
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          CidrIp: 0.0.0.0/0
          Description: Application Web Port
        # Web Port 80
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: Frontend Web Traffic
        # Restricted SSH Port 22
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref AdminIP
          Description: Administrator SSH Access
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-ec2-sg'

  # RDS Database Security Group
  RDSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Amazon RDS PostgreSQL instance
      VpcId: !Ref VPC
      SecurityGroupIngress:
        # Port 5432 accessible ONLY from EC2 Security Group
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref EC2SecurityGroup
          Description: PostgreSQL access from application EC2 instances only
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-rds-sg'

  # ========================================================
  # RDS POSTGRESQL 16 DATABASE (PRIVATE)
  # ========================================================
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private subnets for RDS PostgreSQL
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-db-subnet-group'

  PostgreSQLRDSInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: !Sub '${EnvironmentName}-db'
      Engine: postgres
      EngineVersion: '16.3'
      DBInstanceClass: db.t3.micro
      AllocatedStorage: 20
      StorageType: gp3
      DBName: unieligible
      MasterUsername: !Ref DBUsername
      MasterUserPassword: !Ref DBPassword
      DBSubnetGroupName: !Ref DBSubnetGroup
      VPCSecurityGroups:
        - !Ref RDSSecurityGroup
      PubliclyAccessible: false
      MultiAZ: false
      BackupRetentionPeriod: 7
      DeletionProtection: false
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-postgres'

  # ========================================================
  # AMAZON ECR REPOSITORY
  # ========================================================
  ECRRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: unieligible-backend
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Retain only the last 10 images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 10
                },
                "action": {
                  "type": "expire"
                }
              }
            ]
          }
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-ecr'

  # ========================================================
  # EC2 APPLICATION INSTANCE (PUBLIC SUBNET)
  # ========================================================
  EC2Instance:
    Type: AWS::EC2::Instance
    DependsOn: PostgreSQLRDSInstance
    Properties:
      InstanceType: t3.small
      KeyName: !Ref EC2KeyPairName
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds:
        - !Ref EC2SecurityGroup
      ImageId: ami-0f5ee92e2d63afc18 # Ubuntu 22.04 LTS (ap-south-1)
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 20
            VolumeType: gp3
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          apt-get update -y
          apt-get install -y docker.io docker-compose awscli
          systemctl start docker
          systemctl enable docker
          usermod -aG docker ubuntu
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-app-server'

Outputs:
  VPCId:
    Description: VPC ID
    Value: !Ref VPC

  PublicSubnetId:
    Description: Public Subnet ID
    Value: !Ref PublicSubnet

  EC2PublicIP:
    Description: Public IP of the Application EC2 instance
    Value: !GetAtt EC2Instance.PublicIp

  RDSEndpoint:
    Description: Private Endpoint of Amazon RDS PostgreSQL
    Value: !GetAtt PostgreSQLRDSInstance.Endpoint.Address

  ECRUri:
    Description: ECR Repository URI
    Value: !GetAtt ECRRepository.RepositoryUri

